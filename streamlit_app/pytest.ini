[pytest]
testpaths = tests
addopts = -ra
markers =
    slow: real tool runs through worker processes (seconds to minutes)
    mp: needs a Materials Project API key (MP_API_KEY)
    gpu: needs a CUDA GPU visible to torch
    mlp: runs a machine-learning potential (downloads models for Orb/MatterSim)
    network: needs internet access
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
